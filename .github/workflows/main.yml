name: WooCommerce → Salesforce sync

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      sync:
        description: 'Which sync to run'
        type: choice
        options:
          - both
          - bfa
          - store
        default: both
      dry_run:
        description: 'Preview only (write nothing to Salesforce or WooCommerce)'
        type: boolean
        default: true
      lookback_days:
        description: 'How many days of orders to check'
        type: string
        default: '3'
      resync_synced:
        description: 'Catch-up: re-run orders that were already synced (fills in missing records)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: bfa-salesforce-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WC_STORE_URL: ${{ secrets.WC_STORE_URL }}
      WC_CONSUMER_KEY: ${{ secrets.WC_CONSUMER_KEY }}
      WC_CONSUMER_SECRET: ${{ secrets.WC_CONSUMER_SECRET }}
      SF_AUTH_URL: ${{ secrets.SF_AUTH_URL }}
      CFP_META_KEY: ${{ vars.CFP_META_KEY }}
      SF_CFP_FIELD: ${{ vars.SF_CFP_FIELD }}
      LOOKBACK_DAYS: ${{ inputs.lookback_days || '3' }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
      RESYNC_SYNCED: ${{ github.event_name == 'workflow_dispatch' && inputs.resync_synced || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # BFA runs first and Store second, never at the same time, so a buyer who is new
      # to Salesforce is created once and the second sync finds them.
      - name: BFA sync
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.sync != 'store' }}
        run: node sync.js bfa
      - name: Store sync
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.sync != 'bfa') }}
        run: node sync.js store
